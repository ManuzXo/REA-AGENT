name: Windows setup and MCP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: windows-latest
    strategy:
      matrix:
        powershell: [powershell.exe, pwsh.exe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Verify setup without downloads or user registration
        shell: pwsh
        run: ./scripts/test-setup.ps1 -PowerShell '${{ matrix.powershell }}'
      - name: Install locked runtime from a clean checkout
        shell: pwsh
        run: ./scripts/setup.ps1 -Action Runtime
      - name: Verify the exported MCP command
        shell: pwsh
        run: |
          ./scripts/setup.ps1 -Action Create -Profile ci -Template builtin
          ./scripts/setup.ps1 -Action Mcp -Profile ci
          node scripts/test-mcp.mjs --snapshot .rea/mcp/ci.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
